<!doctype html>
<!--
  Scheduler, resources.mismo.org/scheduler/
  Finds a meeting time with people inside and outside MISMO: proposes times from the team's Outlook
  availability, collects who can make which time, drafts the emails, and reminds the organizer to follow up.

  BEFORE UPLOADING A NEW COPY OF THIS FILE: download the current index.html from GitHub first and make your
  changes to that copy. Uploading an older copy silently undoes everything that changed since.

  Built the same way as Team HQ and Marketing HQ: the shared resources.mismo.org sign-in (/assets/session.js)
  and the save relay (project key "scheduler", data in the PRIVATE repository GitMISMO/scheduler-data).
  No GitHub token, API key or record is ever kept in this file. Outlook availability is read, never written,
  from Team HQ's own files (team-hq-data/data/cal-<person>.json), and follow-up reminders are written to
  Team HQ as tasks, so they show on the organizer's board on the day they fall due.

  Opened anywhere other than resources.mismo.org (or with ?preview=1) it runs as a PREVIEW: sample requests,
  nothing saved.
-->
<html lang="en" data-rs-gate>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Scheduler</title>
<script>
/* Theme first, so the page never flashes the wrong one. Same key every MISMO page uses. */
(function(){ try { var t = localStorage.getItem('mismo.portal.theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
/* Preview anywhere but the real site. */
window.SCHED_PREVIEW = location.hostname !== 'resources.mismo.org' || /[?&]preview=1\b/.test(location.search);
if (window.SCHED_PREVIEW) document.documentElement.removeAttribute('data-rs-gate');
</script>
<script>if (!window.SCHED_PREVIEW) document.write('<script src="/assets/session.js"><\/script>');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#0d314c; --sky:#74bfeb; --navy-deep:#06202f; --navy-mid:#14486e; --sky-soft:#a9d8f3; --sky-wash:#e4f2fb;
  --ground:#f1f6fa; --surface:#ffffff; --surface-2:#f6fafd; --surface-3:#e9f1f8;
  --border:#d5e2ed; --border-strong:#adc4d6; --rule:#e5eef5;
  --ink:#0d314c; --ink-2:#456179; --ink-3:#7794aa;
  --good:#0f7b5c; --bad:#b3372c; --warn:#a2701a;
  --good-soft:#e2f3ec; --bad-soft:#fbe9e7; --warn-soft:#fbf1dc; --link:#14486e;
  --btn:#0d314c; --btn-ink:#ffffff; --tab-on:#0d314c;
  --c1:#2477b8; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
  --free:#d9efe5; --some:#fbecc9; --busy:#f3d6d2; --unk:#eef3f7; --pick:#0d314c; --pick-ink:#fff;
  --shadow:0 1px 2px rgba(13,49,76,.06),0 4px 14px rgba(13,49,76,.05);
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:var(--sans);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52;
  --border:#1f4a63; --border-strong:#2f6688; --rule:#173547;
  --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4;
  --good:#4fc79b; --bad:#f08579; --warn:#e0a83c; --sky-wash:#102f41;
  --good-soft:#123a30; --bad-soft:#3d1f1d; --warn-soft:#3a2e14; --link:#74bfeb;
  --btn:#74bfeb; --btn-ink:#06202f; --tab-on:#74bfeb;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --free:#16463a; --some:#4a3b17; --busy:#4b2422; --unk:#173547; --pick:#74bfeb; --pick-ink:#06202f;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52;
  --border:#1f4a63; --border-strong:#2f6688; --rule:#173547;
  --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4;
  --good:#4fc79b; --bad:#f08579; --warn:#e0a83c; --sky-wash:#102f41;
  --good-soft:#123a30; --bad-soft:#3d1f1d; --warn-soft:#3a2e14; --link:#74bfeb;
  --btn:#74bfeb; --btn-ink:#06202f; --tab-on:#74bfeb;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --free:#16463a; --some:#4a3b17; --busy:#4b2422; --unk:#173547; --pick:#74bfeb; --pick-ink:#06202f;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5}
[hidden]{display:none!important}
a{color:var(--link)}
h1,h2,h3{letter-spacing:-.012em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}

/* ===== masthead (the Summit HQ / Marketing HQ bar) ===== */
.hqtop{position:sticky;top:0;z-index:50;height:58px;background:var(--navy);color:#fff;display:flex;align-items:center;
  padding:0 max(16px,env(safe-area-inset-left,0px));box-shadow:0 1px 0 rgba(80,164,219,.28)}
.logoplate{background:#fff;border-radius:7px;padding:8px 14px;display:flex;align-items:center;line-height:0;flex:0 0 auto}
.logoplate .wordmark{height:22px;width:auto;display:block}
.mastrule{display:block;width:2px;height:32px;flex:0 0 auto;margin-inline:18px;border-radius:1px;background:var(--sky)}
.hqname{font-size:15.5px;font-weight:700;color:var(--sky);white-space:nowrap}
.hqtop-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.eyebrow-m{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:600;white-space:nowrap}
.theme-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:5px;padding:5px 10px;font-size:11.5px;cursor:pointer}
.theme-btn:hover{background:rgba(255,255,255,.18)}
#rs-account{flex:0 0 auto;display:inline-flex;align-items:center}
@media(max-width:700px){.eyebrow-m{display:none}}
@media(max-width:480px){.mastrule{margin-inline:10px}.logoplate{padding:7px 10px}.logoplate .wordmark{height:18px}}

/* ===== tabs ===== */
.tabs{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:58px;z-index:40}
.tabs-in{max-width:1180px;margin:0 auto;display:flex;gap:4px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:13px 12px 10px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sky)}
.count{font-family:var(--mono);font-size:11px;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-3);color:var(--ink-2)}
.count.hot{background:var(--bad);color:#fff}

/* ===== page ===== */
main{max-width:1180px;margin:0 auto;padding:24px 16px 80px}
.preview-band{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:20px;font-size:13.5px}
.notice{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--sky);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:13.5px;color:var(--ink-2)}
.notice b{color:var(--ink)}
.notice.warn{border-left-color:var(--warn)}
.notice.bad{border-left-color:var(--bad)}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:24px}
.pagehead p{margin:4px 0 0;color:var(--ink-2)}
.pagehead .grow{flex:1 1 300px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin-bottom:28px}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--rule)}
.panel-h h2{font-size:16px}
.panel-h .sub{color:var(--ink-3);font-size:13px}
.panel-h .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.panel-b{padding:16px 18px}
.step{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;flex:none}
:root[data-theme="dark"] .step{background:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .step{background:var(--sky);color:var(--navy-deep)}}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ===== buttons ===== */
.btn{appearance:none;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:7px;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;text-decoration:none;line-height:1.3}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--border-strong)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.btn.big{padding:11px 18px;font-size:14.5px}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.linkbtn{appearance:none;background:none;border:0;padding:0;color:var(--link);text-decoration:underline;cursor:pointer;font-size:inherit}

/* ===== pills ===== */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:3px;white-space:nowrap;border:1px solid transparent}
.p-collect{background:var(--sky-wash);color:var(--navy-mid);border-color:var(--sky)}
:root[data-theme="dark"] .p-collect{color:var(--sky-soft)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .p-collect{color:var(--sky-soft)}}
.p-ready{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.p-booked{background:var(--navy);color:#fff}
:root[data-theme="dark"] .p-booked{background:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .p-booked{background:var(--sky);color:var(--navy-deep)}}
.p-draft{background:var(--surface-3);color:var(--ink-2);border-color:var(--border)}
.p-due{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.p-cancel{background:var(--surface-3);color:var(--ink-3);text-decoration:line-through}
.p-unsch{background:var(--bad-soft);color:var(--bad)}
.p-yes{background:var(--good-soft);color:var(--good)}
.p-wait{background:var(--warn-soft);color:var(--warn)}

/* ===== follow-up cards ===== */
.fu-list{display:grid;gap:10px}
.fu{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--border);border-left:4px solid var(--bad);border-radius:8px;background:var(--surface)}
.fu.soon{border-left-color:var(--warn)}
.fu .who{flex:1 1 280px;min-width:0}
.fu .who b{display:block}
.fu .who span{color:var(--ink-2);font-size:13px}
.fu .acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:26px 18px;text-align:center;color:var(--ink-3)}

/* ===== request list ===== */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:none;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--sky);color:var(--navy-deep)}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--sky);border-radius:8px;padding:12px 14px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow);font:inherit}
.stat:hover{border-color:var(--border-strong)}
.stat[aria-pressed="true"]{outline:2px solid var(--navy);outline-offset:-1px}
:root[data-theme="dark"] .stat[aria-pressed="true"]{outline-color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stat[aria-pressed="true"]{outline-color:var(--sky)}}
.stat b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-top:3px;white-space:nowrap}
.stat.hot{border-top-color:var(--bad)}.stat.hot b{color:var(--bad)}
.stat.good{border-top-color:var(--good)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:760px){.flow{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.flow{grid-template-columns:1fr}}
.flow div{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;box-shadow:var(--shadow)}
.flow div .step{margin-bottom:8px}
.flow h3{font-size:14px;margin:0 0 4px}
.flow p{margin:0;font-size:13px;color:var(--ink-2)}
.auto-tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:1px 7px;border-radius:3px;background:var(--sky-wash);color:var(--navy-mid);border:1px solid var(--sky)}
.robotfacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media(max-width:760px){.robotfacts{grid-template-columns:1fr 1fr}}
.robotfacts div{background:var(--surface-2);border:1px solid var(--rule);border-radius:7px;padding:10px 12px;min-width:0}
.robotfacts small{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.robotfacts b{display:block;font-size:14px;margin-top:2px;overflow-wrap:anywhere}
table.mails{width:100%;border-collapse:collapse;font-size:13px}
table.mails th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);padding:6px 8px;border-bottom:1px solid var(--border)}
table.mails td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top;font-variant-numeric:tabular-nums}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
@media(max-width:520px){.reqs{grid-template-columns:1fr}}
.req{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.req:hover{border-color:var(--border-strong)}
.req h3{font-size:15.5px}
.req .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-2)}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:3px}

/* ===== people ===== */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border:1px solid var(--border);border-radius:3px;background:var(--surface-2);font-size:13px}
.chip .av{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;background:var(--navy-mid);flex:none}
.chip .tag{font-size:11px;color:var(--ink-3)}
label.pick{cursor:pointer}
label.pick input{position:absolute;opacity:0;pointer-events:none}
label.pick .chip{transition:background .12s}
label.pick input:checked + .chip{background:var(--sky-wash);border-color:var(--sky);font-weight:600}
label.pick input:focus-visible + .chip{outline:2px solid var(--sky);outline-offset:2px}
.guests{width:100%;border-collapse:collapse}
.guests th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--rule)}
.guests td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:middle}
.guests tr:last-child td{border-bottom:0}
.guests .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:760px){
  .guests thead{display:none}
  .guests tr{display:block;padding:10px 0;border-bottom:1px solid var(--rule)}
  .guests td{display:block;border:0;padding:3px 0}
  .guests .acts{justify-content:flex-start;margin-top:6px}
}

/* ===== availability grid ===== */
.gridwrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
table.av{border-collapse:separate;border-spacing:0;min-width:100%;font-size:13px}
table.av th,table.av td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);padding:7px 8px;text-align:center;white-space:nowrap}
table.av th:first-child,table.av td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:170px;white-space:normal}
table.av thead th{background:var(--surface-2);font-weight:600;font-size:12px;vertical-align:bottom}
table.av thead th .d{display:block;color:var(--ink-3);font-weight:500}
table.av thead th.best{background:var(--good-soft);box-shadow:inset 0 3px 0 var(--good)}
table.av td.c{min-width:92px}
.cell{appearance:none;border:0;border-radius:5px;width:100%;padding:5px 4px;font-size:12px;font-weight:600;cursor:pointer;display:block}
.cell[disabled]{cursor:default}
.c-yes{background:var(--free);color:var(--good)}
.c-maybe{background:var(--some);color:var(--warn)}
.c-no{background:var(--busy);color:var(--bad)}
.c-none{background:var(--unk);color:var(--ink-3);font-weight:500}
table.av tfoot td{background:var(--surface-2);font-weight:600}
.grp td{background:var(--surface-3)!important;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;text-align:left!important}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}

/* ===== time picker ===== */
.tp-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tp-wrap{overflow:auto;max-height:min(62vh,640px);border:1px solid var(--border);border-radius:8px}
table.tp{border-collapse:separate;border-spacing:0;font-size:12px;width:100%}
table.tp th{position:sticky;top:0;background:var(--surface-2);z-index:2;padding:6px 4px;border-bottom:1px solid var(--border);font-weight:600;min-width:78px}
table.tp th:first-child,table.tp td:first-child{position:sticky;left:0;background:var(--surface);z-index:3;min-width:62px;text-align:right;padding-right:8px;color:var(--ink-3);font-family:var(--mono);font-size:11px}
table.tp th:first-child{z-index:4}
table.tp td{padding:1px 2px;border-bottom:1px solid var(--rule)}
.slot{appearance:none;border:1px solid transparent;width:100%;height:24px;border-radius:4px;cursor:pointer;font-size:10.5px;font-weight:600;padding:0 3px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.s-free{background:var(--free);color:var(--good)}
.s-some{background:var(--some);color:var(--warn)}
.s-busy{background:var(--busy);color:var(--bad)}
.s-unk{background:var(--unk);color:var(--ink-3)}
.s-on{background:var(--pick)!important;color:var(--pick-ink)!important;border-color:var(--pick)}
.s-in{background:color-mix(in srgb,var(--pick) 55%,transparent)!important;color:var(--pick-ink)!important}
.slot:hover{border-color:var(--ink-2)}
.slot:focus-visible{outline:2px solid var(--sky);outline-offset:1px}

/* ===== forms ===== */
.form{display:grid;grid-template-columns:repeat(12,1fr);gap:14px 16px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 12}
.f.w6{grid-column:span 6}.f.w4{grid-column:span 4}.f.w3{grid-column:span 3}.f.w8{grid-column:span 8}
@media(max-width:700px){.f.w6,.f.w4,.f.w3,.f.w8{grid-column:span 12}}

.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;padding:24px 30px;border-radius:14px;margin:0 0 16px;color:#fff;background:radial-gradient(70% 140% at 100% 0%,rgba(116,191,235,.30),transparent 62%),radial-gradient(55% 120% at 0% 110%,rgba(95,211,154,.16),transparent 60%),linear-gradient(135deg,#0d314c 0%,#14486e 58%,#1d6a96 100%);border:1px solid rgba(116,191,235,.25);box-shadow:0 20px 44px -26px rgba(6,32,47,.85)}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 44px rgba(255,255,255,.025),0 0 0 88px rgba(255,255,255,.02);pointer-events:none}
.hero-l{position:relative;z-index:1;min-width:0}
.hero-eb{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--sky);flex-wrap:wrap}
.hero-eb #asof{color:rgba(255,255,255,.62);font-size:11px;white-space:nowrap}
.hero-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.4)}
.hero h1{margin:6px 0 8px;font-size:28px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.hero-s{margin:0;max-width:760px;font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.8)}
.hero-s b{color:#fff;font-weight:700}
.hero-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hbtn{border:1px solid var(--sky);background:var(--sky);color:#06202f;border-radius:6px;padding:8px 15px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:filter .12s,background .12s}
.hbtn:hover{filter:brightness(1.07)}
.hbtn.ghost{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.32)}
.hbtn.ghost:hover{background:rgba(255,255,255,.14)}
.hbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hero-r{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.hring{position:relative;width:132px;height:132px}
.hring svg{display:block;width:100%;height:100%}
.hring .arc{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.hring-m{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hring-m b{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em}
.hring-m span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-top:6px}
.hring-c{margin-top:8px;font-size:12px;color:rgba(255,255,255,.72);white-space:nowrap}
.hring-c b{color:#fff}
.ktile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px 14px 19px;display:flex;flex-direction:column;min-width:0;box-shadow:0 1px 2px rgba(6,32,47,.05);transition:transform .15s,box-shadow .15s,border-color .15s}
.ktile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k)}
.ktile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--k) 55%,var(--border));box-shadow:0 16px 28px -20px rgba(6,32,47,.5)}
.ktile:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
.kt{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;min-width:0}
.kt i{width:28px;height:28px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--k) 24%,var(--surface));color:var(--ink)}
.kt svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kt .go{margin-left:auto;color:var(--ink-3);font-weight:600;opacity:0;transition:opacity .15s}
.ktile:hover .kt .go,.ktile:focus-visible .kt .go{opacity:1}
.ktile .kn{font-size:34px;font-weight:700;line-height:1.05;margin-top:10px;color:var(--ink);letter-spacing:-.02em}
.ktile .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{margin-top:12px;height:30px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px}
.mcap{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-3)}
.kbar i,.pbar-b i{display:block;height:100%;min-width:3px;transition:flex-grow .9s cubic-bezier(.2,.8,.2,1)}
.mini.cols{flex-direction:row;align-items:flex-end;gap:4px}
.mini.cols i{flex:1;border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--k) 38%,var(--surface-3));transition:height .9s cubic-bezier(.2,.8,.2,1)}
.mini.cols i.now{background:var(--k)}
.hgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.hside{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;min-width:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:10px;padding:13px 16px 11px;border-bottom:1px solid var(--rule)}
.ph h2{font-size:15px;font-weight:700;margin:0;white-space:nowrap}
.ph .hint{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
.link{all:unset;cursor:pointer;margin-left:auto;font-size:12.5px;font-weight:600;color:var(--navy-mid);white-space:nowrap}
:root[data-theme="dark"] .link{color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link{color:var(--sky)}}
.link:hover{text-decoration:underline}
.rows{display:flex;flex-direction:column}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:10px minmax(0,1.6fr) minmax(0,1.2fr) 118px 96px;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--rule);font-size:13.5px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.row .dot{width:10px;height:10px;border-radius:3px;background:var(--k)}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .wh{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dt{color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.age{justify-self:end;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.age.late{background:color-mix(in srgb,#ff8f7d 26%,var(--surface));color:var(--ink)}
.age.ok{background:color-mix(in srgb,#5fd39a 24%,var(--surface));color:var(--ink)}
.allclear{display:flex;align-items:center;gap:14px;padding:22px 18px}
.ac-i{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,#5fd39a 26%,var(--surface));color:var(--good)}
.ac-i svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.allclear b{display:block;font-size:15px}
.allclear span{font-size:13px;color:var(--ink-2);line-height:1.5}
.wtip{margin:0;padding:10px 16px 0;font-size:12.5px;color:var(--ink-3);line-height:1.5}
.pane{position:fixed;top:calc(var(--hq-h) + env(safe-area-inset-top,0px));right:0;bottom:0;width:min(1040px,75vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:-10px 0 30px rgba(6,32,47,.18);z-index:96;transform:translateX(102%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.pane.on{transform:none}
.pane-h{display:flex;align-items:flex-start;gap:12px;padding:18px 22px 14px;border-bottom:1px solid var(--rule)}
.pane-h h2{margin:0;font-size:21px;font-weight:700}
.pane-h .ps{font-size:13px;color:var(--ink-2);margin-top:3px}
.pane-x{margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:5px;width:30px;height:30px;font-size:17px;cursor:pointer;flex:none}
.pane:not(.on){visibility:hidden;transition:transform .22s cubic-bezier(.4,0,.2,1),visibility 0s .22s}
.helpgrid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.helpnav{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px}
.helpnav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.helpnav button i{width:9px;height:9px;border-radius:2px;background:var(--k,#9fb3c8);flex:none}
.helpnav button:hover{background:var(--surface-2)}
.helpnav button[aria-current]{background:color-mix(in srgb,var(--sky) 16%,var(--surface));color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--sky)}
.helpnav button:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.helpbody{padding:18px 22px 20px}
.helpbody h2{margin:0 0 4px;font-size:19px}
.helpbody .lead{margin:0 0 16px;color:var(--ink-2);font-size:14px;line-height:1.55;max-width:860px}
.hsteps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 16px}
.hstep{border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px 10px;align-content:start}
.hstep b.n{grid-row:span 2;width:24px;height:24px;border-radius:5px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
:root[data-theme="dark"] .hstep b.n{background:var(--sky);color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hstep b.n{background:var(--sky);color:var(--navy)}}
.hstep strong{font-size:14px}
.hstep span{font-size:13px;color:var(--ink-2);line-height:1.5}
.hnote{border-left:3px solid var(--sky);background:var(--surface-2);padding:10px 14px;border-radius:0 6px 6px 0;font-size:13.5px;color:var(--ink-2);line-height:1.55;margin:0 0 12px}
.hnote b{color:var(--ink)}
.hfaq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hfaq div{border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.hfaq b{display:block;font-size:14px;margin-bottom:4px}
.hfaq span{font-size:13px;color:var(--ink-2);line-height:1.5}
.dash-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0 0 16px}
.hgrid{margin-bottom:8px}
.hside>.panel{margin:0}
.pane{top:var(--hq-h);width:min(1040px,75vw)}
.pane-b{padding:18px 22px;overflow:auto;flex:1;min-height:0}
.pane-b main,.pane-b #pane-app{max-width:none;padding:0}
.row{grid-template-columns:10px minmax(0,1.5fr) minmax(0,1.2fr) auto auto}
.row .acts{display:flex;gap:6px;justify-self:end}
.row .acts .btn{padding:5px 11px;font-size:12.5px}
.row.r3{grid-template-columns:10px minmax(0,1fr) auto}
.row .nm small{display:block;font-weight:400;font-size:12px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.age.wait{background:color-mix(in srgb,#f0b94a 26%,var(--surface));color:var(--ink)}
.age.sky{background:color-mix(in srgb,#74bfeb 26%,var(--surface));color:var(--ink)}
.avgrid{display:grid;grid-template-columns:118px repeat(5,minmax(0,1fr));gap:4px;padding:12px 16px 14px;font-size:12px;align-items:center}
.avgrid .h{font-size:11px;font-weight:700;color:var(--ink-3);text-align:center;white-space:nowrap}
.avgrid .who{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avgrid .c{height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink)}
.avkey{display:flex;gap:14px;padding:0 16px 12px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.avkey i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.feed{display:flex;flex-direction:column}
.feed .fi{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:8px 16px;border-bottom:1px solid var(--rule);font-size:13px;cursor:pointer}
.feed .fi:last-child{border-bottom:0}
.feed .fi:hover{background:var(--surface-2)}
.feed .fi span{color:var(--ink-3);font-size:12px;white-space:nowrap}
.feed .fi b{font-weight:600}
.feed .fi em{font-style:normal;color:var(--ink-2)}
.helpbody ul,.helpbody ol{margin:0 0 14px;padding-left:20px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.helpbody li{margin-bottom:4px}
.helpbody h3{font-size:15px;margin:18px 0 6px}
.helpbody table{width:100%;border-collapse:collapse;font-size:13px;margin:0 0 14px}
.helpbody th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:7px 10px;border-bottom:1px solid var(--border)}
.helpbody td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
.helpbody td b{color:var(--ink)}
.pane-b .pagehead h1{display:none}
.pane-b .pagehead{margin-bottom:12px}
@media(max-width:1100px){.dash-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.hgrid{grid-template-columns:1fr}.pane{width:100vw}}
@media(max-width:700px){.hero{grid-template-columns:1fr;padding:20px;gap:16px}.hero-r{flex-direction:row;gap:14px;align-items:center}.hring{width:96px;height:96px}.hring-m b{font-size:22px}.hring-m span{font-size:8.5px}.hero h1{font-size:23px}.ktile .kn{font-size:28px}.row{grid-template-columns:10px minmax(0,1fr) auto}.row .wh,.row .dt{display:none}.avgrid{grid-template-columns:76px repeat(5,minmax(0,1fr))}.helpgrid{grid-template-columns:1fr}.helpnav{flex-direction:row;overflow-x:auto}.hsteps,.hfaq{grid-template-columns:1fr}}
@media(max-width:480px){.dash-tiles{grid-template-columns:1fr}}
@media(max-width:700px){.ph .hint{display:none}.ph{flex-wrap:wrap}.ph h2{white-space:normal}}
.hgrid{align-items:stretch}
.hside>.panel:last-child{flex:1}
.feed .fi{grid-template-columns:76px minmax(0,1fr)}
.feed .fi span{overflow:hidden;text-overflow:ellipsis}
/* ---- Statistics ---- */
.stathead{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.stathead h1{margin:0;font-size:26px;color:var(--ink)}
.stathead p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.stiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:28px}
@media (max-width:1180px){.stiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.stiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stile{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--k,var(--c1));border-radius:10px;box-shadow:var(--shadow);padding:13px 15px 14px;min-width:0}
.stile small{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stile b{display:block;font-size:28px;line-height:1.1;margin:6px 0 3px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stile span{display:block;font-size:12.5px;color:var(--ink-2)}
.mixbar{display:flex;gap:2px;height:16px;margin:16px 16px 14px;border-radius:4px;overflow:hidden;background:var(--surface)}
.mixbar i{display:block;min-width:4px;outline-offset:2px}
.mixkey{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 22px;padding:0 16px 16px}
.mixkey div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);min-width:0}
.mixkey i{width:10px;height:10px;border-radius:3px;flex:none}
.mixkey b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.mixkey em{font-style:normal;color:var(--ink-3);font-weight:400;margin-left:4px}
.hbars{padding:12px 16px 16px;display:grid;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(60px,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.hbar .tr{height:12px;display:flex}
.hbar .tr i{display:block;height:100%;background:var(--c1);border-radius:0 4px 4px 0;min-width:3px}
.hbar b{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;white-space:nowrap}
.hbar b em{font-style:normal;font-weight:400;color:var(--ink-3)}
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.figs div{padding:11px 16px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--ink-2)}
.figs div:nth-child(odd){border-right:1px solid var(--rule)}
.figs b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:560px){.figs{grid-template-columns:1fr}.figs div:nth-child(odd){border-right:0}.mixkey{grid-template-columns:1fr}}
.stgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-bottom:16px}
@media (max-width:900px){.stgrid{grid-template-columns:1fr}}
.sttip{position:fixed;z-index:300;pointer-events:none;background:var(--navy-deep);color:#fff;font-size:12px;line-height:1.35;padding:6px 9px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:240px}

</style>
</head>

/* reading a pasted email: Claude when it can, a careful guess when it can't */
function readEmail(txt) {
  var roster = TEAM.people.map(function (p) { return p.id + ' = ' + p.name + (emailOf(p) ? ' <' + emailOf(p) + '>' : ''); }).join('\n');
  return askReady().then(function (ok) {
    if (!ok) return guessFromEmail(txt);
    var prompt = 'You help MISMO staff set up meetings. Read the email below (it may be a forwarded thread) and work out the meeting someone wants scheduled.\n\n' +
      'MISMO staff (id = name <email>):\n' + roster + '\n\n' +
      'Return ONLY a JSON object, no other text:\n{"title": short meeting name (use the name given in the email if there is one), "purpose": one or two plain sentences on what the meeting is for, "duration": minutes as a number (30 if not said), "askedBy": the person asking for the meeting to be scheduled, "askedByEmail": their email address if shown, "internal": [ids of the MISMO staff who should attend, from the list above], "guests": [{"name":..., "email":..., "org": company}] for attendees outside MISMO only}\n' +
      'Only include attendees the email says should be in the meeting, not everyone copied. Use email addresses exactly as written in the email; leave email "" if it isn’t there. Do not include the person who will do the scheduling unless the email says they attend.\n\nEMAIL:\n' + txt.slice(0, 20000);
    return ask(prompt).then(function (text) {
      var j = jsonIn(text); if (!j) return guessFromEmail(txt);
      var ids = TEAM.people.map(function (p) { return p.id; });
      return { byClaude: true, title: String(j.title || '').slice(0, 140), purpose: String(j.purpose || '').slice(0, 2000), duration: +j.duration || 30, askedBy: String(j.askedBy || '').slice(0, 120), askedByEmail: /^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(String(j.askedByEmail || '').trim()) ? String(j.askedByEmail).trim().toLowerCase() : '',
        internal: (Array.isArray(j.internal) ? j.internal : []).filter(function (x) { return ids.indexOf(x) >= 0; }),
        guests: (Array.isArray(j.guests) ? j.guests : []).slice(0, 20).map(function (g) { return { name: String(g.name || '').slice(0, 100), email: String(g.email || '').slice(0, 200), org: String(g.org || '').slice(0, 120) }; }) };
    }, function () { return guessFromEmail(txt); });
  });
}
function guessFromEmail(txt) {
  var found = { title: '', internal: [], guests: [], purpose: '' };
  var q = /[“"]([^”"\n]{4,120})[”"]/.exec(txt); if (q) found.title = q[1].trim();
  if (!found.title) { var s = /^\s*Subject:\s*(?:(?:RE|FW|FWD):\s*)*(.+)$/im.exec(txt); if (s) found.title = s[1].trim().slice(0, 140); }
  var seen = {}, re = /([A-Z][\w.'\-]+(?:,?\s+[A-Z][\w.'\-]+){0,3})\s*[<(](?:mailto:)?([^\s@<>()]+@[^\s@<>()]+\.[A-Za-z]{2,})[>)]/g, m;
  while ((m = re.exec(txt))) {
    var em = m[2].toLowerCase(); if (seen[em]) continue; seen[em] = 1;
    var nm = m[1].replace(/^(?:From|To|Cc|Sent|Subject)\s*:?\s*/i, '').trim();
    if (/,/.test(nm)) { var bits = nm.split(/\s*,\s*/); nm = bits[1] + ' ' + bits[0]; }
    var p = personByEmail(em) || personByName(nm);
    if (p) { if (found.internal.indexOf(p.id) < 0) found.internal.push(p.id); }
    else if (!/@(mismo|mba)\.org$/.test(em)) found.guests.push({ name: nm, email: em, org: (em.split('@')[1] || '').split('.')[0].replace(/^./, function (c) { return c.toUpperCase(); }) });
  }
  var fr = /^\s*From:\s*([^<\n]+?)\s*<([^>\s]+@[^>\s]+)>/m.exec(txt);
  if (fr) { var fn = fr[1].trim(); if (/,/.test(fn)) { var fb = fn.split(/\s*,\s*/); fn = fb[1] + ' ' + fb[0]; } found.askedBy = fn; found.askedByEmail = fr[2].toLowerCase(); }
  var me0 = meP(); found.internal = found.internal.filter(function (id) { return !me0 || id !== me0.id; });
  return Promise.resolve(found);
}

    if (!confirm('Approve ' + slotLabel(sl, VIEW_TZ, true) + ' for “' + req.title + '”?\n\nThe Scheduler then sends everyone the calendar invitation from scheduling@mismo.org.')) return;
    return approveSlot(req, sl);
  }
  var sc = score(req, sl);
  var msg = 'Book “' + req.title + '” for ' + slotLabel(sl, VIEW_TZ, true) + '?\n\n' + sc.yes + ' can make it' + (sc.maybe ? ', ' + sc.maybe + ' tentative' : '') + (sc.no ? ', ' + sc.no + ' can’t' : '') + (sc.none ? ', ' + sc.none + ' haven’t said' : '') + '.\n\nNext you’ll send the calendar invite from Outlook.';
  if (!confirm(msg)) return;
  var r = clone(getReq(req.id)); r.status = 'booked'; r.chosen = sl.id; r.bookedAt = Date.now();
  put(r, 'Booked for ' + slotLabel(sl, ET, true));
  toast('Booked. Now send the invite from Outlook — the buttons are at the top.');
  window.scrollTo(0, 0);
}

/* ======================================================================
   INCOMING: meeting requests that arrived by email
   ----------------------------------------------------------------------
   A Power Automate flow watches scheduling@mismo.org (people's own meeting
   requests reach it through an Outlook rule that redirects them there) and
   sends each email to the relay, which adds it to data/inbox.json in the
   private scheduler-data repo: {docs:{<id>:{from, fromName, subject, body,
   receivedAt, mailbox, status:'new'|'started'|'dismissed', reqId}}}.
   Staff turn an email into a request (Claude reads it), draft a reply to the
   person who sent it, or set it aside. Nothing here sends anything.
   ====================================================================== */
var INBOX = { server: { docs: {} }, sha: null, loaded: false, show: lsGet('inShow', 'new') };
function inboxItems() { var d = INBOX.server.docs || {}; return Object.keys(d).map(function (k) { return d[k]; }).sort(function (a, b) { return (b.receivedAt || 0) - (a.receivedAt || 0); }); }
function inboxNew() { return inboxItems().filter(function (x) { return x.status === 'new'; }); }
function loadInbox() {
  if (PREVIEW) { INBOX.loaded = true; return Promise.resolve(false); }
  return readData(PROJECT, 'inbox').then(function (b) {
    var c = b && b.data && typeof b.data === 'object' ? b.data : {}, before = JSON.stringify(INBOX.server.docs);
    INBOX.server = Object.assign({}, c, { docs: c.docs && typeof c.docs === 'object' ? c.docs : {} });
    INBOX.sha = (b && b.sha) || null; INBOX.loaded = true;
    return before !== JSON.stringify(INBOX.server.docs);
  }, function () { INBOX.loaded = true; return false; });
}
/* small changes (status, link to a request), read-modify-write so a newly arrived email is never lost */
var inChain = Promise.resolve();
function updInbox(id, patch) {
  var cur = INBOX.server.docs[id]; if (!cur) return Promise.resolve();
  INBOX.server.docs[id] = Object.assign({}, cur, patch, { by: me().name, byAt: Date.now() });
  render();
  if (PREVIEW) return Promise.resolve();
  inChain = inChain.then(function () {
    var tries = 0;
    function go() {
      return readData(PROJECT, 'inbox').then(function (b) {
        var c = (b && b.data && typeof b.data === 'object') ? b.data : {}, next = Object.assign({}, c, { docs: Object.assign({}, c.docs || {}) });
        delete next.savedBy; delete next.savedAt;
        if (!next.docs[id]) return;
        next.docs[id] = Object.assign({}, next.docs[id], patch, { by: me().name, byAt: Date.now() });
        return writeData(PROJECT, 'inbox', next, b && b.sha).then(function (r) { INBOX.server = next; INBOX.sha = r && r.sha; });
      }).catch(function (e) { if (e.status === 409 && tries < 5) { tries++; return new Promise(function (r) { setTimeout(r, 400 * tries); }).then(go); } throw e; });
    }
    return go();
  }).catch(function (e) { toast('That change to Incoming didn’t save (' + (e.code || e.message) + '). Try again.'); });
  return inChain;
}

    'Sent: ' + new Date(x.receivedAt || Date.now()).toLocaleString('en-US', { timeZone: ET, dateStyle: 'full', timeStyle: 'short' }) + '\nSubject: ' + (x.subject || '') + '\n\n' + (x.body || '');

  function onKey(e) { if (e.key === 'Escape') { var all = $$('.scrim'); if (all[all.length - 1] === s) close(); } }

/* ---------------- "when did you send it?" ----------------
   Sending happens in Outlook, so the Scheduler only knows the day you tell it. Today is the default; an earlier day
   (up to 60 days back) starts the follow-up clock from then, so marking it late doesn't push the reminder back. */
function askDate(o) {
  return new Promise(function (resolve) {
    var D = dialog(o.title || 'When did you send it?'), today = todayISO(ET), done = false;
    var defIso = o.def ? parts(o.def, ET).iso : today;
    D.body.appendChild(el('p', 'small muted', esc(o.lead || 'Pick the day the email went out. The follow-up reminder counts from that day.')));
    var row = el('div', 'grow-row');
    var inp = el('input'); inp.type = 'date'; inp.value = defIso > today ? today : defIso; inp.max = today; inp.min = isoAdd(today, -60); inp.style.width = 'auto'; inp.setAttribute('aria-label', 'Day it was sent');
    row.appendChild(inp);
    row.appendChild(btn('Today', 'ghost sm', function () { inp.value = today; hint(); }));
    var yd = isoAdd(today, -1); while (isWeekend(yd)) yd = isoAdd(yd, -1);
    row.appendChild(btn(dow(yd) === 5 && dow(today) === 1 ? 'Last Friday' : 'Yesterday', 'ghost sm', function () { inp.value = yd; hint(); }));
    D.body.appendChild(row);
    var h = el('p', 'small'); h.style.marginTop = '12px'; D.body.appendChild(h);
    function pick() { var v = inp.value; if (!/^\d{4}-\d{2}-\d{2}$/.test(v) || v > today || v < inp.min) return null; return v === today ? (o.def && parts(o.def, ET).iso === today ? o.def : Date.now()) : at(v, 12 * 60, ET); }
    function hint() {
      var t = pick();
      h.innerHTML = t ? 'If there\u2019s no reply, you\u2019ll be reminded to follow up on <b>' + esc(new Date(addBiz(t, o.days || DEFAULT_FOLLOW_DAYS) + 'T12:00:00Z').toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'long', month: 'long', day: 'numeric' })) + '</b>.'
        : '<span style="color:var(--bad)">Pick a day between ' + esc(inp.min) + ' and today.</span>';
    }
    inp.addEventListener('input', hint); inp.addEventListener('change', hint); hint();
    var x = $('.x', D.root), close0 = D.close;
    function finish(v) { if (done) return; done = true; close0(); resolve(v); }
    x.onclick = function () { finish(null); };
    D.foot.appendChild(btn('Cancel', 'ghost', function () { finish(null); }));
    D.foot.appendChild(btn(o.ok || 'Save', '', function () { var t = pick(); if (!t) { hint(); return; } finish(t); }, 'check'));
    /* Escape or a click outside also count as cancel */
    var obs = new MutationObserver(function () { if (!document.body.contains(D.root)) { obs.disconnect(); if (!done) { done = true; resolve(null); } } });
    obs.observe(document.body, { childList: true });
  });
}

  /* ---- Past Meetings: booked and already happened ---- */
  var pastM = booked.map(function (r) { return { r: r, sl: slotById(r, r.chosen) }; }).filter(function (x) { return x.sl && x.sl.e <= now; }).sort(function (a, b) { return b.sl.s - a.sl.s; });
  var pm = dashPanel('Past Meetings', pastM.length ? pastM.length + ' so far' : '', pastM.length > 5 ? 'All Past' : '', function () { STATE.listShow = 'past'; lsSet('listShow', 'past'); go('list'); });
  pastM.slice(0, 5).forEach(function (x) {
    var r = x.r;
    pm.rows.appendChild(dashRow({ k: '#9fb3c8', nm: r.title || 'Meeting', small: whoOf(r), wh: fmtTime(x.sl.s, VIEW_TZ) + ' ' + tzAbbr(x.sl.s, VIEW_TZ) + ' · ' + (r.where || 'Zoom'), age: fmtDay(x.sl.s, VIEW_TZ), go: function () { go(null, r.id); } }));
  });
  if (!pastM.length) pm.p.appendChild(el('div', 'empty', 'Meetings move here once they’ve happened, so you can look back at what was scheduled.'));
  L.appendChild(pm.p);

  /* ---- Team This Week ---- */
  var tw = dashPanel('Team This Week', 'free time, 9–5 Eastern', 'Calendar', function () { go('cal'); });
  var tNow = Date.now(), tIso = todayISO(ET), dayOver = tNow >= at(tIso, 17 * 60, ET);
  var days5 = bizDaysAhead(5, dayOver ? tIso : isoAdd(tIso, -1)).filter(function (d) { return !isWeekend(d); }).slice(0, 5);
  var g = el('div', 'avgrid');
  g.appendChild(el('span'));
  days5.forEach(function (d) { g.appendChild(el('span', 'h', esc(new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', timeZone: 'UTC' })))); });
  TEAM.people.forEach(function (pp) {
    g.appendChild(el('span', 'who', esc(pp.name)));
    days5.forEach(function (d) {
      var free = 0, known = 0;
      for (var m = 9 * 60; m < 17 * 60; m += 30) { if (at(d, m + 30, ET) <= tNow) continue; var st = calState(pp.id, at(d, m, ET), at(d, m + 30, ET)); if (st === null) continue; known++; if (st === 'free') free++; }
      var c = el('span', 'c');
      if (!known) { c.style.background = 'var(--unk)'; c.textContent = '–'; c.title = pp.name + ': no Outlook data'; }
      else { var f = free / known, pctF = Math.round(100 * f); c.textContent = pctF + '%'; c.title = pp.name + ', ' + d + ': ' + pctF + '% free'; c.style.background = 'color-mix(in srgb,' + (f >= .6 ? '#5fd39a' : f >= .3 ? '#f0b94a' : '#ff8f7d') + ' ' + Math.round(22 + 30 * (f >= .6 ? f : 1 - f)) + '%,var(--surface))'; }
      g.appendChild(c);
    });
  });
  tw.rows.appendChild(g);
  tw.p.appendChild(el('div', 'avkey', '<span><i style="background:color-mix(in srgb,#5fd39a 45%,var(--surface))"></i>Mostly free</span><span><i style="background:color-mix(in srgb,#f0b94a 40%,var(--surface))"></i>Some time</span><span><i style="background:color-mix(in srgb,#ff8f7d 45%,var(--surface))"></i>Booked up</span>'));
  R.appendChild(tw.p);

  /* ---- Couldn't Schedule: closed without a time ---- */
  var unsch = all.filter(couldntSchedule).sort(function (a, b) { return (b.closedAt || b.updatedAt || 0) - (a.closedAt || a.updatedAt || 0); });
  var us = dashPanel('Couldn’t Schedule', unsch.length ? plural(unsch.length, 'request', 'requests') : '', unsch.length > 4 ? 'All' : '', function () { STATE.listShow = 'unscheduled'; lsSet('listShow', 'unscheduled'); go('list'); });
  unsch.slice(0, 4).forEach(function (r) {
    var why = (r.robot && r.robot.why) ? 'Stopped because ' + r.robot.why : 'Closed by ' + (first(r.closedBy || '') || 'staff');
    us.rows.appendChild(dashRow({ k: '#ff8f7d', nm: r.title || 'Meeting request', small: why, wh: whoOf(r), age: 'Closed ' + shortAgo(r.closedAt || r.updatedAt || now), go: function () { go(null, r.id); } }));
  });
  if (!unsch.length) us.p.appendChild(el('div', 'empty', 'Nothing yet. If we try and can’t find a time, close the request as Couldn’t Schedule and it stays here for reference.'));
  L.appendChild(us.p);

  /* ---- Incoming Email ---- */
  var ib = dashPanel('Incoming Email', 'scheduling@mismo.org', 'All Email', function () { go('inbox'); });
  inbox.slice(0, 5).forEach(function (x) {
    var req = x.reqId ? getReq(x.reqId) : null;
    ib.rows.appendChild(dashRow({ cls: 'r3', k: x.status === 'started' ? '#5fd39a' : x.status === 'dismissed' ? '#9fb3c8' : '#f0b94a', nm: x.subject || '(no subject)', small: displayName(x) + (x.robotNote ? ' · ' + x.robotNote : ''), age: shortAgo(x.receivedAt || now), go: function () { if (req) go(null, req.id); else go('inbox'); } }));
  });
  if (!inbox.length) ib.p.appendChild(el('div', 'empty', 'Nothing has come in yet. Emails to scheduling@mismo.org show here a few minutes after they arrive.'));
  R.appendChild(ib.p);

  /* ---- What the Scheduler did ---- */
  var ac = dashPanel('Latest Activity', '', '', null), feed = el('div', 'feed');
  var events = [];
  all.forEach(function (r) { (r.log || []).forEach(function (e) { events.push({ r: r, e: e }); }); });
  events.sort(function (a, b) { return (b.e.at || 0) - (a.e.at || 0); }).slice(0, 14).forEach(function (x) {
    var f = el('div', 'fi'); f.innerHTML = '<span>' + esc(shortAgo(x.e.at || now)) + '</span><div><b>' + esc(x.r.title || 'Meeting request') + '</b> <em>· ' + esc(x.e.what) + (x.e.by && x.e.by !== 'Scheduler' ? ' (' + esc(first(x.e.by)) + ')' : '') + '</em></div>';
    f.onclick = function () { go(null, x.r.id); }; feed.appendChild(f);
  });
  if (!events.length) feed.appendChild(el('div', 'empty', 'What the Scheduler does shows here as it happens.'));
  ac.rows.appendChild(feed); R.appendChild(ac.p);
  /* keep the two columns level: show as much activity as the left column has room for */
  requestAnimationFrame(function () {
    if (getComputedStyle(grid).gridTemplateColumns.split(' ').length < 2) { while (feed.children.length > 6) feed.removeChild(feed.lastChild); return; }
    /* measure at natural height (the columns stretch to match afterwards) */
    grid.style.alignItems = 'start'; L.style.height = R.style.height = 'auto';
    $$('.panel', grid).forEach(function (p) { p.style.flex = '0 0 auto'; });
    while (feed.children.length > 3 && R.offsetHeight > L.offsetHeight + 4) feed.removeChild(feed.lastChild);
    grid.style.alignItems = ''; L.style.height = R.style.height = '';
    $$('.panel', grid).forEach(function (p) { p.style.flex = ''; });
  });
}

/* ======================================================================
   HELP — the full documentation, one topic at a time, the Membership Desk way
   ====================================================================== */
var HELP_STEPS = function (rows) { return '<div class="hsteps">' + rows.map(function (r, i) { return '<div class="hstep"><b class="n">' + (i + 1) + '</b><strong>' + r[0] + '</strong><span>' + r[1] + '</span></div>'; }).join('') + '</div>'; };
var HELP_FAQ = function (rows) { return '<div class="hfaq">' + rows.map(function (r) { return '<div><b>' + r[0] + '</b><span>' + r[1] + '</span></div>'; }).join('') + '</div>'; };
var HELP = [
  { id: 'overview', k: '#74bfeb', t: 'Overview', h: function () { return '<h2>What the Scheduler Does</h2><p class="lead">The Scheduler finds a meeting time that works for people inside and outside MISMO, like Doodle but on its own. Anyone can email a request to <b>scheduling@mismo.org</b>. The Scheduler reads it, checks everyone’s Outlook, offers times, keeps the poll current and books the meeting. You and Vanessa only step in to approve a time or when something needs a person.</p>' +
    HELP_STEPS([['An Email Comes In', 'Someone emails scheduling@mismo.org, or forwards a request there. Within about five minutes the Scheduler reads it with Claude: who should meet, for how long, and any times they suggested.'],
      ['Their Times Come First', 'If everyone from MISMO is free at a time they suggested, and nobody else has to agree, that time is held for approval.'],
      ['Otherwise a Poll', 'Each outside guest gets their own link to the times when everyone at MISMO is free. The person who asked is copied.'],
      ['You Approve, It Books', 'When a time works for everyone, you or Vanessa approve it on the Dashboard. Within minutes everyone gets an Outlook invitation from scheduling@mismo.org with the MISMO Zoom room link. The invitation is the confirmation. Nothing to send by hand.']]) +
    '<div class="hnote"><b>Nothing goes to anyone outside MISMO as “booked” until you or Vanessa approve it.</b> Meetings with MISMO people only are booked straight away, because there is nobody outside to tell. And when no time works for everyone, the Scheduler asks you what to do instead of sending a second poll.</div>' +
    '<h3>Who Uses It</h3><ul><li><b>Vanessa</b> looks after scheduling day to day: she approves times, decides what happens when no time works, and gets the Needs a Look emails.</li><li><b>Jonna</b> can approve too, and is copied on every email that goes to staff.</li><li><b>Everyone on the team</b> can open the Scheduler, see every request and run one by hand. Access is set in People &amp; Access, like every other tool.</li></ul>'; } },
  { id: 'flow', k: '#5fd39a', t: 'How a Request Flows', h: function () { return '<h2>From Email to Booked Meeting</h2><p class="lead">Every request moves through the same stages. Its stage shows as the colored tag on the request.</p>' +
    '<table><thead><tr><th>Stage</th><th>What is happening</th><th>What you do</th></tr></thead><tbody>' +
    '<tr><td><b>Working on It</b></td><td>The Scheduler has read the email and is checking Outlook.</td><td>Nothing.</td></tr>' +
    '<tr><td><b>Waiting on Replies</b></td><td>A poll is out. Times come off when someone at MISMO gets busy or a guest says no; when no time works for everyone, Vanessa and Jonna decide what happens next (book the closest time, make someone optional, or send new times). A guest marked optional doesn’t have to be free for a time to work. Guests who haven’t answered get a warm follow-up a week after the poll, then weekly, three at most.</td><td>Nothing. It shows under Polls Out on the Dashboard.</td></tr>' +
    '<tr><td><b>Waiting for Approval</b></td><td>A time works for everyone. It is held, so no other request can take it.</td><td>Approve it, or press Book under a different time.</td></tr>' +
    '<tr><td><b>Waiting on Replies, in Needs You</b></td><td>Everyone has answered and no time works for all of them. Nothing more goes out until you decide.</td><td>Book the closest time, make someone optional, or press Send New Times. See When No Time Works.</td></tr>' +
    '<tr><td><b>Booked</b></td><td>Everyone has the Outlook invitation with the Zoom room link.</td><td>Nothing. If the invitation couldn’t go by itself, Vanessa gets Booked, Send the Invite with a button that opens it in Outlook.</td></tr>' +
    '<tr><td><b>Needs a Look</b></td><td>The Scheduler stopped and told Vanessa why.</td><td>Fix what’s needed, then Hand Back to the Scheduler, or carry on by hand.</td></tr>' +
    '<tr><td><b>Couldn’t Schedule</b></td><td>Closed after we tried and no time could be found. Kept on the Dashboard for reference.</td><td>Bring it back from the request to try again.</td></tr>' +
    '<tr><td><b>Cancelled</b></td><td>Stopped for good.</td><td>Bring it back from the request if needed.</td></tr></tbody></table>' +
    '<h3>Rules It Follows</h3><ul><li>Times are offered 9:00 AM to 5:00 PM Eastern, on working days only. Fridays between Memorial Day and Labor Day end at 1:00 PM.</li><li>MISMO holidays are never offered: MLK Day, Presidents’ Day, Memorial Day, Juneteenth, Independence Day, Labor Day, Veterans Day, Thanksgiving and the day after, and Winter Break.</li><li>A poll offers up to six times over the coming working days, at most two a day, starting the next working day.</li><li>Tentative in Outlook counts as busy when offering new times.</li><li>If Outlook information is missing or more than six hours old, nothing is decided until it is fresh. If it stays missing for a working day, Vanessa is told.</li><li>Once people have answered, the Scheduler never sends a second set of times on its own: Vanessa or Jonna decide. (If nobody has answered and the times simply run out, it refreshes them.)</li><li>A guest marked optional doesn’t have to be free for a time to work, and is invited as optional.</li><li>Meetings can be any length. The length comes from the email (for example “an hour”) or from Edit details; changing it while a poll is out swaps in fresh times at the new length.</li><li>Zoom meetings use the one MISMO Zoom room, so two Scheduler Zoom meetings never overlap, and they keep clear of the workgroup meetings on the Meeting Trackers schedule and of info@mismo.org’s calendar.</li></ul>'; } },
  { id: 'approve', k: '#ff8f7d', t: 'Approving a Time', h: function () { return '<h2>Approving a Time</h2><p class="lead">When the Scheduler finds a time that works for everyone, Vanessa gets an <b>Approve a Time</b> email with Jonna copied, and the request appears at the top of <b>Needs You</b> on the Dashboard.</p>' +
    HELP_STEPS([['Open the Dashboard', 'The time waiting for approval is the first row under Needs You, with why it was picked.'], ['Approve', 'Press Approve on the row, or open the request and press Approve This Time. Only Vanessa and Jonna see the button.'], ['Or Pick Another Time', 'Open the request and press Book under any time in the grid. That approves that time instead, and works even while the poll is still out.'], ['It Sends Everything', 'Within a few minutes everyone gets an Outlook invitation from scheduling@mismo.org with the Zoom room link; that is their confirmation. Optional guests are invited as optional. Vanessa gets Booked and Invited, with Jonna copied.']]) +
    '<div class="hnote"><b>If Outlook changes before you approve</b> (someone books that time), the Scheduler lets the held time go and finds another. Nothing has gone to the guests, so there is nothing to take back.</div>'; } },
  { id: 'polls', k: '#a78bfa', t: 'Polls and Guests', h: function () { return '<h2>What Guests See</h2><p class="lead">Each guest gets an email from MISMO Scheduling with one button: <b>Choose the Times That Work</b>. The times are not listed in the email, so they are always current when the guest opens the link.</p>' +
    '<ul><li>The link opens a MISMO page with the meeting, its length and where it is. The guest ticks ✓ for times that work and ✗ for the ones that don’t, can add a note, and presses Send.</li><li>Times show in the guest’s own time zone, and they can switch it.</li><li>Each link belongs to one guest. It never shows other guests or their answers.</li><li>Guests can come back to the same link to change their answers until the meeting is booked.</li><li>If you send new times, or change the meeting’s length, guests who already answered get a short <b>New Times</b> email.</li><li>A guest who hasn’t answered gets three warm follow-ups, a week apart. Stop them on the request with <b>Stop Follow-Ups</b>.</li><li>Press <b>Make optional</b> next to a guest under Outside guests when the meeting can go ahead without them. Press <b>Make required</b> to undo it.</li></ul>' +
    '<h3>When a Guest Replies by Email</h3><p class="lead">Their reply lands in scheduling@mismo.org, shows in the request’s history, and Vanessa gets a <b>Reply About</b> email. If they gave times in the reply, open the request and press <b>Enter their answer</b> next to their name.</p>'; } },
  { id: 'decide', k: '#eb6834', t: 'When No Time Works', h: function () { return '<h2>When No Time Works for Everyone</h2><p class="lead">Once guests have answered and no time on the poll works for all of them, the Scheduler stops and asks. It never sends a second poll on its own. Vanessa gets a <b>No Time Works Yet</b> email, with Jonna copied, listing the closest times and who can make each, and the request shows in <b>Needs You</b>.</p>' +
    '<table><thead><tr><th>You want to</th><th>Do this</th><th>What happens</th></tr></thead><tbody>' +
    '<tr><td>Go with the closest time</td><td>Open the request and press <b>Book</b> under that time.</td><td>Booked straight away. Everyone gets the invitation.</td></tr>' +
    '<tr><td>Go ahead without someone</td><td>Under Outside guests, press <b>Make optional</b> next to them.</td><td>Times only have to work for the others. If one already does, it’s held for your approval. They’re still invited, as optional.</td></tr>' +
    '<tr><td>Try a fresh set of times</td><td>Press <b>Send New Times</b> (on the Needs You row or on the request).</td><td>New times go on the poll and everyone who answered gets a New Times email.</td></tr>' +
    '<tr><td>Change the length</td><td>Press <b>Edit details</b> and change it (for example to an hour).</td><td>A fresh set of times at the new length goes out.</td></tr>' +
    '<tr><td>Give up</td><td>Press <b>Close as Couldn’t Schedule</b>.</td><td>It moves to Couldn’t Schedule on the Dashboard for reference.</td></tr></tbody></table>'; } },
  { id: 'dash', k: '#f0b94a', t: 'The Dashboard', h: function () { return '<h2>Reading the Dashboard</h2><p class="lead">Everything is on one page. Click any row to open it in the panel on the right; press × or Escape to close it.</p>' +
    '<table><thead><tr><th>Part</th><th>What it shows</th></tr></thead><tbody>' +
    '<tr><td><b>The Banner</b></td><td>What needs you, polls out, and meetings booked this week. The ring shows how many of the last 30 days’ requests are booked.</td></tr>' +
    '<tr><td><b>Needs You</b></td><td>Times to approve, polls where no time works (your call), polls whose three follow-ups went unanswered, requests the Scheduler stopped on, and people to follow up with on requests run by hand.</td></tr>' +
    '<tr><td><b>Polls Out</b></td><td>Every poll waiting on guests: who has answered, how many times are on offer, and which follow-up they’re on.</td></tr>' +
    '<tr><td><b>Booked This Week</b></td><td>Meetings booked in the last seven days, automatic and by hand.</td></tr>' +
    '<tr><td><b>Emails This Week</b></td><td>Everything that reached scheduling@mismo.org, and how many became requests.</td></tr>' +
    '<tr><td><b>Scheduled</b></td><td>Every booked meeting still ahead, soonest first. This week’s are marked green.</td></tr>' +
    '<tr><td><b>Past Meetings</b></td><td>Meetings we scheduled that have already happened, newest first, for reference.</td></tr>' +
    '<tr><td><b>Couldn’t Schedule</b></td><td>Requests we tried and closed without a time, with the reason. Open one and press Bring it back to try again.</td></tr>' +
    '<tr><td><b>Team This Week</b></td><td>How much of each person’s day is free from 9 to 5 Eastern, from Outlook. Open Calendar for the half-hour view.</td></tr>' +
    '<tr><td><b>Incoming Email</b></td><td>The latest emails and what the Scheduler did with each one.</td></tr>' +
    '<tr><td><b>Latest Activity</b></td><td>Everything the Scheduler and the team did, newest first.</td></tr></tbody></table>' +
    '<div class="hnote"><b>Search</b> is at the top of the menu on the left. Type a person’s name or email, a company, a subject line, a MISMO teammate, or a word like booked or couldn’t; type two words to narrow it down (for example <i>kelly booked</i>). It finds requests, outside guests and the emails that came in.</div>'; } },
  { id: 'stats', k: '#2477b8', t: 'Statistics', h: function () { return '<h2>Statistics</h2><p class="lead">The Statistics tab on the left shows how scheduling is going. Pick Last 30 Days, Last 90 Days, This Year or All Time at the top; everything counts the requests started in that period. Hover over any bar for its number.</p>' +
    '<table><thead><tr><th>Part</th><th>What it shows</th></tr></thead><tbody>' +
    '<tr><td><b>The Six Figures</b></td><td>Requests, Booked, Couldn’t Schedule, In Progress, the average time from request to booked, and how long guests take to answer a poll.</td></tr>' +
    '<tr><td><b>Where Requests Ended Up</b></td><td>The split between booked, couldn’t schedule, still in progress and cancelled.</td></tr>' +
    '<tr><td><b>How Meetings Got Booked</b></td><td>Whether the times the person offered worked straight away, the first poll did it, more times were needed, or it was booked by hand.</td></tr>' +
    '<tr><td><b>Polls and Approvals</b></td><td>Guests asked and answered, follow-ups, reply times, and how long a found time waits for approval.</td></tr>' +
    '<tr><td><b>MISMO People in Meetings</b></td><td>For each person, meetings booked out of the requests they were on.</td></tr>' +
    '<tr><td><b>Organizations</b></td><td>The companies we schedule with most, from the guest’s company or email address.</td></tr>' +
    '<tr><td><b>Email to scheduling@mismo.org</b></td><td>What came in, how much became requests, and how often the Scheduler had to stop for a person.</td></tr></tbody></table>'; } },
  { id: 'hand', k: '#9fb3c8', t: 'Running One by Hand', h: function () { return '<h2>Running a Request Yourself</h2><p class="lead">Any request can be run by hand, and any request you start by hand can be given to the Scheduler.</p>' +
    HELP_STEPS([['Start a Request', 'Press Start a Request in the banner. Paste the email and press Read it for me, or fill it in.'], ['Pick Times', 'A calendar shows when the MISMO people are free in Outlook. Click the times to offer.'], ['Send the Poll', 'Each guest gets the same branded poll email from scheduling@mismo.org, with their own link.'], ['Book', 'Press Book under the time that works. Then send the invite and, if you like, Draft the confirmation email.']]) +
    '<ul><li><b>Take Over</b> on an automatic request stops the Scheduler emailing about it; you carry on by hand.</li><li><b>Let the Scheduler Handle It</b> (or <b>Hand Back to the Scheduler</b> on a Needs a Look) gives it back. It picks up within a few minutes.</li><li>Requests run by hand show in <b>Follow Up</b> when a guest is due a nudge, and add a follow-up task to the organizer’s Team HQ board.</li></ul>'; } },
  { id: 'emails', k: '#5fd39a', t: 'Emails It Sends', h: function () { return '<h2>Every Email, Who Gets It and When</h2><p class="lead">All of them come from <b>MISMO Scheduling</b> (scheduling@mismo.org) in the MISMO email frame. Replies come back to scheduling@mismo.org.</p>' +
    '<table><thead><tr><th>Email</th><th>Goes to</th><th>When</th></tr></thead><tbody>' +
    '<tr><td><b>We’re Working on Your Meeting Request</b></td><td>The person who asked</td><td>Only when nothing else reaches them straight away, for example while a time waits for approval.</td></tr>' +
    '<tr><td><b>Finding a Time for …</b></td><td>Each outside guest, the person who asked copied</td><td>When a poll goes out.</td></tr>' +
    '<tr><td><b>No Time Works Yet</b></td><td>Vanessa, Jonna copied</td><td>When everyone has answered and no time works for all of them. It lists the closest times. The Scheduler never sends a second set on its own: you Book a time, make someone optional, or press Send New Times.</td></tr>' +
    '<tr><td><b>New Times for …</b></td><td>Guests who already answered</td><td>Only when you press Send New Times (or change the meeting’s length).</td></tr>' +
    '<tr><td><b>Following Up / Still Hoping / One Last Note</b></td><td>A guest who hasn’t answered</td><td>Three warm follow-ups: a week after the poll, then a week apart. They stop when the guest answers, the meeting is booked, or you press Stop Follow-Ups.</td></tr>' +
    '<tr><td><b>Follow-Ups Finished</b></td><td>Vanessa, Jonna copied</td><td>When the third follow-up goes with no answer. Start them again for three more, leave them stopped, or close the request as Couldn’t Schedule.</td></tr>' +
    '<tr><td><b>Approve a Time</b></td><td>Vanessa, Jonna copied</td><td>When a time works for everyone.</td></tr>' +
    '<tr><td><b>Confirmed: … on …</b></td><td>The guests and the person who asked, MISMO attendees copied</td><td>Only if the calendar invitation couldn’t go by itself. Normally the invitation is the confirmation, so no separate email goes out.</td></tr>' +
    '<tr><td><b>Calendar Invitation</b></td><td>Everyone in the meeting</td><td>Once a time is approved: an Outlook invitation from scheduling@mismo.org with the MISMO Zoom room link (info@mismo.org’s room). Guests can join any time. The Scheduler never books two Zoom meetings at once, or over info@mismo.org’s own meetings, since the room holds one meeting at a time.</td></tr>' +
    '<tr><td><b>Booked and Invited</b></td><td>Vanessa, Jonna copied</td><td>Once the invitation has gone. (If it can’t go by itself, this is <b>Booked, Send the Invite</b> instead, with a button that opens it in Outlook.)</td></tr>' +
    '<tr><td><b>Needs a Look</b></td><td>Vanessa, Jonna copied</td><td>When the Scheduler stops on a request.</td></tr>' +
    '<tr><td><b>Reply About …</b></td><td>Vanessa, Jonna copied</td><td>When someone replies to a Scheduler email.</td></tr></tbody></table>' +
    '<p class="lead">Every email the Scheduler sent for a request is listed on that request, with whether it went out.</p>'; } },
  { id: 'look', k: '#f0b94a', t: 'When It Stops', h: function () { return '<h2>Needs a Look</h2><p class="lead">The Scheduler stops and emails Vanessa, with Jonna copied, rather than guess. The request shows the reason at the top. If no time can be found, press <b>Close as Couldn’t Schedule</b>: it moves to the Couldn’t Schedule list on the Dashboard for reference.</p>' +
    '<table><thead><tr><th>Why it stopped</th><th>What to do</th></tr></thead><tbody>' +
    '<tr><td>The email doesn’t say who from MISMO should be in the meeting</td><td>Edit details, tick the MISMO people, then Hand Back to the Scheduler.</td></tr>' +
    '<tr><td>The person who asked isn’t on the guest list</td><td>Edit details and add them as a guest, then hand it back.</td></tr>' +

/* ============================================================
   THE RAIL

   The menu down the left: show it, hide it, remember which, and the search
   that jumps to a session, a task or a person wherever it lives.
   ============================================================ */
(function(){
  "use strict";
  const KEY='hq.rail.off';
  const rail=()=>document.getElementById('rail');

  function set(off, remember){
    document.body.classList.toggle('railmini', !!off);
    const h=document.getElementById('rail-hide');
    if(h){ h.setAttribute('aria-expanded', off?'false':'true');
      h.setAttribute('aria-label', off?'Open the menu':'Narrow the menu');
      h.title = (off?'Open the menu':'Narrow the menu')+' (backslash)'; }
    if(off) close();                       /* no room for the results while it is narrow */
    if(remember!==false){ try{ localStorage.setItem(KEY, off?'1':'0'); }catch(e){} }
    /* the week sizes itself to what is left of the screen */
    setTimeout(()=>{ try{ if(window.__fitBoard) window.__fitBoard(); }catch(e){}
      window.dispatchEvent(new Event('resize')); }, 230);
  }
  function toggle(){ set(!document.body.classList.contains('railmini')); }

  /* a narrow screen starts with it out of the way; otherwise it is remembered */
  function start(){
    /* Jonna, 2026-09-27: Summit HQ opens with the menu open every time, whatever it was
       left as. Narrowing it still works for the visit. A phone-sized screen still starts
       with it narrow, because open it would cover the page. */
    const off = window.matchMedia('(max-width:900px)').matches;
    set(off, false);
    const h=document.getElementById('rail-hide'); if(h) h.addEventListener('click',toggle);
    const sc=document.getElementById('rail-scrim'); if(sc) sc.addEventListener('click',()=>set(true));
    /* the magnifier stands in for the search box while it is narrow */
    const qb=document.getElementById('rail-qb');
    if(qb) qb.addEventListener('click',()=>{ set(false);
      setTimeout(()=>{ const q=document.getElementById('rail-q'); if(q) q.focus(); },230); });
    /* on a narrow screen, picking a tab narrows it again */
    document.querySelectorAll('.hq nav button[data-hq]').forEach(b=>{
      b.addEventListener('click',()=>{
        /* a card left open on the tab being left goes away with it */
        try{ if(window.__pane) window.__pane.close(); }catch(e){}
        if(window.matchMedia('(max-width:900px)').matches) set(true);
      });
    });
    wireFind();
  }

  /* \\ toggles it from anywhere, Escape closes the search */
  document.addEventListener('keydown',e=>{
    const t=e.target;
    const typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
    if(e.key==='\\' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); toggle(); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){

  function gather(q){

    const push=(group,name,where,go)=>{ if(out.length<60) out.push({group,name,where,go,s:score(name)}); };
    /* every word typed has to appear somewhere, so "kelly booked" or "example lending" both work */
    const words=t.split(' ').filter(Boolean);
    const hit=(hay)=>{ const x=norm(hay); return words.every(w=>x.indexOf(w)>=0); };
    const reqs=(window.allReqs ? window.allReqs() : []);
    const about=(r)=>(window.__sched && window.__sched.about) ? window.__sched.about(r) : { label:'', when:'', staff:[] };
    /* meeting requests: title, who asked, who's in it (MISMO and outside), companies, emails, subject, purpose, status, booked time */
    try{

          (r.guests||[]).map(g=>[g.name,g.email,g.org].join(' ')).join(' ')].join(' ');
